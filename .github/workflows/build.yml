# Tests Wisp on Windows, Linux and macOS and builds a release program for each,
# attached to the run as artifacts: a zip with Wisp.exe for Windows, a tarball
# with the wisp program for Linux and macOS. For a tag like v0.2.0 it also
# publishes them as the GitHub release "Wisp 0.2.0".
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            file: wisp-windows-x64.zip
            test: true
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: wisp-linux-x64.tar.gz
            test: true
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            file: wisp-macos-arm64.tar.gz
            test: true
          # Built on the Apple silicon runner, so its tests can't run there.
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            file: wisp-macos-x64.tar.gz
            test: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.test
        shell: bash
        run: |
          if ! cargo test --locked --target ${{ matrix.target }} 2>&1 | tee test.log; then
            # Put the failures on the run's summary page too, where they're easier to find.
            failures=$(grep -E -A4 "^thread '.*panicked at" test.log | head -60 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests failed on ${{ matrix.name }}::${failures}"
            exit 1
          fi

      - name: Clippy
        if: matrix.test
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir dist staging
          release=target/${{ matrix.target }}/release
          cp LICENSE README.md staging/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$release/wisp.exe" staging/Wisp.exe
            pwsh -NoProfile -Command 'Compress-Archive -Path staging/* -DestinationPath dist/${{ matrix.file }}'
          else
            # A tarball keeps wisp runnable; artifacts and zips lose the permission.
            cp "$release/wisp" staging/
            tar -czf "dist/${{ matrix.file }}" -C staging wisp LICENSE README.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.file }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: downloads
          # The Windows build is a zip of its own: keep it as it is.
          skip-decompress: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          mkdir release
          # wisp-windows-x64.zip becomes wisp-0.2.0-windows-x64.zip, and so on.
          find downloads -type f -name 'wisp-*' | while read -r file; do
            name=$(basename "$file")
            cp "$file" "release/wisp-$version-${name#wisp-}"
          done
          if [ "$(ls release | wc -l)" -ne 4 ]; then
            echo "::error::Expected 4 builds, found: $(find downloads -type f | tr '\n' ' ')"
            exit 1
          fi
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          # The notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '/^## / { on = ($2 == v); next } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$TAG" release/* --title "Wisp $version" --notes-file notes.md --verify-tag
