<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Wisp app icon, used at 40 px and up. Smaller sizes use icon-small.svg. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#5A3FE0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wisp" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFA81F"/>
      <stop offset="1" stop-color="#FFD95C"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1B1466" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#plate)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#sheen)"/>
  <!-- the note -->
  <path filter="url(#lift)" fill="#FFFFFF"
        d="M92 54 H160 L196 90 V182 Q196 200 178 200 H92 Q74 200 74 182 V72 Q74 54 92 54 Z"/>
  <path fill="#D5DCFF" d="M160 54 V78 Q160 90 172 90 H196 Z"/>
  <g stroke="#C2CBF3" stroke-width="11" stroke-linecap="round">
    <line x1="99" y1="114" x2="146" y2="114"/>
    <line x1="99" y1="140" x2="170" y2="140"/>
  </g>
  <!-- the wisp: one quick stroke of a highlighter -->
  <path fill="none" stroke="url(#wisp)" stroke-width="15" stroke-linecap="round"
        d="M96 172 C118 158 138 182 172 164"/>
</svg>
